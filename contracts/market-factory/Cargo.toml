[package]
name = "market-factory"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Market registry and deployment control plane for Varix"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
market-factory-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
market-factory-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "perps", "factory"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
market-factory-app = { version = "0.1.0", path = "app" }
market-factory-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
varix-shared = { version = "0.1.0", path = "../shared" }
