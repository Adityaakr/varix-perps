[package]
name = "session-registry"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "On-chain signless session registry for Varix Perps"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
session-registry-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
session-registry-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
session-registry-app.workspace = true
session-registry-client.workspace = true
sails-rs = { workspace = true, features = ["gclient", "gtest"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "sessions", "wasm"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
session-registry-app = { version = "0.1.0", path = "app" }
session-registry-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
tokio = "1.48.0"
