[package]
name = "oracle-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Signed oracle relay ingress for Varix Perps"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
oracle-service-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
oracle-service-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
ed25519-dalek.workspace = true
oracle-service-app.workspace = true
oracle-service-client.workspace = true
sails-rs = { workspace = true, features = ["gclient", "gtest"] }
tokio = { workspace = true, features = ["macros", "rt"] }
varix-shared.workspace = true

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "perps", "oracle"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
oracle-service-app = { version = "0.1.0", path = "app" }
oracle-service-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
tokio = "1.48.0"
varix-shared = { version = "0.1.0", path = "../shared" }
