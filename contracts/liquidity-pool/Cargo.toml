[package]
name = "liquidity-pool"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LP liquidity pool for Varix leveraged capacity"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
ethexe = ["liquidity-pool-app/ethexe", "sails-rs/ethexe"]

[dependencies]
liquidity-pool-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
liquidity-pool-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
demo-usdc-vft.workspace = true
demo-usdc-vft-client.workspace = true
liquidity-pool-app.workspace = true
liquidity-pool-client.workspace = true
sails-rs = { workspace = true, features = ["gclient", "gtest"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "liquidity", "wasm"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
demo-usdc-vft = { version = "0.1.0", path = "../demo-usdc-vft" }
demo-usdc-vft-client = { version = "0.1.0", path = "../demo-usdc-vft/client" }
liquidity-pool-app = { version = "0.1.0", path = "app", default-features = false }
liquidity-pool-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
tokio = "1.48.0"
