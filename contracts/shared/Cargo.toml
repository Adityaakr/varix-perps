[package]
name = "varix-shared"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
ethexe = ["dep:alloy-sol-types", "dep:sails-rs", "sails-rs/ethexe"]

[dependencies]
alloy-sol-types = { version = "1.5.7", default-features = false, optional = true }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sails-rs = { version = "0.10.3", default-features = false, optional = true }
