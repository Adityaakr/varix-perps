[package]
name = "demo-usdc-vft"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Demo USDC-like fungible token for Varix"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
ethexe = ["demo-usdc-vft-app/ethexe", "sails-rs/ethexe"]

[dependencies]
demo-usdc-vft-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
demo-usdc-vft-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
demo-usdc-vft-app.workspace = true
demo-usdc-vft-client.workspace = true
sails-rs = { workspace = true, features = ["gclient", "gtest"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "vft", "wasm"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
demo-usdc-vft-app = { version = "0.1.0", path = "app", default-features = false }
demo-usdc-vft-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
tokio = "1.48.0"
