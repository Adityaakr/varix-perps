[package]
name = "vara-eth-probe"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Minimal Vara.eth validation probe"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
ethexe = ["vara-eth-probe-app/ethexe", "sails-rs/ethexe"]

[dependencies]
vara-eth-probe-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
vara-eth-probe-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["OpenAI"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/adityakrx/varix"
license = "MIT"
keywords = ["vara", "gear", "sails", "probe", "wasm"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
vara-eth-probe-app = { version = "0.1.0", path = "app", default-features = false }
vara-eth-probe-client = { version = "0.1.0", path = "client" }
sails-rs = "0.10.3"
